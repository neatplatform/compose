## https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana
##

instance_name = ${HOSTNAME}

# https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/feature-toggles
[feature_toggles]

# https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#analytics
[analytics]
enabled           = true
reporting_enabled = false  # Disable anonymous usage reporting

# https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#log
[log]
mode  = console
level = info

# https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#logconsole
[log.console]
format = json

# https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#paths
[paths]
data         = /data
plugins      = /data/plugins
provisioning = /etc/grafana/provisioning

# https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#server
[server]
http_addr      = 0.0.0.0
http_port      = 3000
domain         = localhost
root_url       = http://localhost:7200
enable_gzip    = true
router_logging = false  # Set to true for debugging

# https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#database
[database]
type = sqlite3
path = /data/grafana.db
wal  = true

# https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#security
[security]
# admin_user                   = admin              # Set via GF_SECURITY_ADMIN_USER
# admin_password               = admin              # Set via GF_SECURITY_ADMIN_PASSWORD
admin_email                    = admin@example.com  # Email of the default Grafana Admin

# Anonymous access lets the rulers call the Alertmanager API without authentication.
# Admin role is needed to POST to /api/alertmanager endpoints.
# https://grafana.com/docs/grafana/latest/setup-grafana/configure-access/configure-authentication/anonymous-auth
[auth.anonymous]
enabled  = true
org_role = Admin

# https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#unified_alerting
[unified_alerting]
enabled      = true
min_interval = 10s  # Minimum interval between rule evaluations

# https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#unified_alertingscreenshots
[unified_alerting.screenshots]
capture                       = true
capture_timeout               = 30s
max_concurrent_screenshots    = 4
upload_external_image_storage = false

# https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#rendering
[rendering]
renderer_token                  = dummy-token
server_url                      = http://renderer:8081/render
callback_url                    = http://grafana:3000/
concurrent_render_request_limit = 4

# https://grafana.com/docs/grafana/latest/setup-grafana/configure-grafana/#smtp
[smtp]
enabled      = true
host         = mailpit:1025
from_address = grafana@example.com
from_name    = Grafana
skip_verify  = true
