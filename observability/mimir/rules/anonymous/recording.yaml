## Mimir supports Prometheus-compatible recording rules.
##
## https://prometheus.io/docs/prometheus/latest/configuration/recording_rules
## https://prometheus.io/docs/practices/rules
##

groups:

  - name: node-recording-rules
    interval: 1m
    limit: 10
    rules:

      - record: node:cpu_utilization:ratio_avg
        expr: >
          1 - avg by(job, instance) (
            rate(node_cpu_seconds_total{mode="idle"}[2m])
          )

      - record: node:memory_utilization:ratio
        expr: >
          1 - (
            node_memory_MemAvailable_bytes
              / node_memory_MemTotal_bytes
          )

      - record: node:filesystem_utilization:ratio
        expr: >
          1 - (
            node_filesystem_avail_bytes{fstype!~"tmpfs|overlay|squashfs|fuse.*|ramfs"}
              / node_filesystem_size_bytes{fstype!~"tmpfs|overlay|squashfs|fuse.*|ramfs"}
          )
