## https://grafana.com/docs/mimir/latest/configure
## https://grafana.com/docs/mimir/latest/configure/configuration-parameters
##

# https://grafana.com/docs/mimir/latest/configure/configuration-parameters/#configuration-parameters
target: all
multitenancy_enabled: false
no_auth_tenant: anonymous

usage_stats:
  enabled: false  # Disable anonymous usage reporting

# https://grafana.com/docs/mimir/latest/configure/configuration-parameters/#server
server:
  log_level: info
  log_format: json
  http_listen_port: 9009
  grpc_listen_port: 9095

# Common configuration for all Mimir components.
# https://grafana.com/docs/mimir/latest/configure/configuration-parameters/#common
common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data

# Override common storage configuration for blocks data.
# https://grafana.com/docs/mimir/latest/configure/configuration-parameters/#blocks_storage
blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/blocks
  tsdb:
    dir: /data/tsdb
    # Short retention forces frequent flushes from the TSDB head to disk blocks, keeping memory usage low.
    # For production, increase this value to reduce flush frequency and I/O overhead.
    retention_period: 1h

# https://grafana.com/docs/mimir/latest/configure/configuration-parameters/#distributor
distributor:
  ring:
    kvstore:
      store: inmemory

# https://grafana.com/docs/mimir/latest/configure/configuration-parameters/#ingester
ingester:
  ring:
    replication_factor: 1
    kvstore:
      store: inmemory

# https://grafana.com/docs/mimir/latest/configure/configuration-parameters/#frontend
frontend:
  query_stats_enabled: true
  log_queries_longer_than: 10s

# https://grafana.com/docs/mimir/latest/configure/configuration-parameters/#query_scheduler
query_scheduler:
  max_outstanding_requests_per_tenant: 10
  ring:
    kvstore:
      store: inmemory

# https://grafana.com/docs/mimir/latest/configure/configuration-parameters/#querier
querier:
  timeout: 2m
  max_concurrent: 4

# https://grafana.com/docs/mimir/latest/configure/configuration-parameters/#store_gateway
store_gateway:
  sharding_ring:
    replication_factor: 1
    kvstore:
      store: inmemory

# https://grafana.com/docs/mimir/latest/configure/configuration-parameters/#compactor
compactor:
  sharding_ring:
    kvstore:
      store: inmemory

# https://grafana.com/docs/mimir/latest/configure/configuration-parameters/#ruler
ruler:
  enable_api: true
  external_url: http://localhost:5200  # Host-accessible links
  evaluation_interval: 1m
  poll_interval: 2m
  rule_path: /tmp/rules  # Path to store temporary rule files
  notification_queue_capacity: 1000
  ring:
    kvstore:
      store: inmemory

# Override common storage configuration for ruler data.
# https://grafana.com/docs/mimir/latest/configure/configuration-parameters/#ruler_storage
ruler_storage:
  backend: local
  local:
    # Source rules from local files.
    # Loads YAML files for each tenant from <directory>/<tenant_id>/ at startup and on every poll.
    # When multi-tenancy and auth is disabled, the tenant ID is always "anonymous".
    directory: /etc/mimir/rules

# https://grafana.com/docs/mimir/latest/configure/configuration-parameters/#limits
limits:
  # Ingestion rate limits
  ingestion_rate: 10000
  ingestion_burst_size: 20000

  # Data cardinality limits
  max_label_name_length: 512
  max_label_value_length: 1024
  max_metadata_length: 1024
  max_label_names_per_series: 20
  max_label_names_per_info_series: 50
  max_fetched_series_per_query: 50000
  max_fetched_chunks_per_query: 2000000

  # Global data limits
  max_global_series_per_user: 100000

  # Query limits
  max_query_lookback: 31d
  max_partial_query_length: 31d
  max_query_parallelism: 10

  # Query Sharding limits
  query_sharding_total_shards: 0
  query_sharding_max_sharded_queries: 0
  query_sharding_max_regexp_size_bytes: 0

  # Ruler limits
  ruler_max_rules_per_rule_group: 20
  ruler_max_rule_groups_per_tenant: 50

  # Delete blocks older than the specified retention period
  compactor_blocks_retention_period: 31d

  # Per-tenant Alertmanager client configuration
  ruler_alertmanager_client_config:
    alertmanager_url: http://alertmanager:9093
    tls_enabled: false
